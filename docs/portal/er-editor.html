<script type="module">
import React, { useState, useEffect, useCallback, useRef, useMemo } from 'react';
import { createRoot } from 'react-dom/client';
import { ReactFlow, Background, Controls, MiniMap, Handle, Position, ReactFlowProvider, useReactFlow, BaseEdge, EdgeLabelRenderer, getSmoothStepPath } from '@xyflow/react';
import ELK from 'elkjs';
import htm from 'htm';

const html = htm.bind(React.createElement);

const STORAGE_KEY = 'er-editor-state-v2';
const HEAD_H = 34;     // ヘッダ高さ(px) — ハンドル位置計算に使用
const ROW_H = 26;      // 列行高さ(px)
const T_HANDLE = '__table__'; // テーブルレベル(列未指定)接続用ハンドル id

// id 生成（このファイルはブラウザ実行のため Date/Math.random 利用可）
let idSeq = 0;
const uid = (p) => `${p}_${(++idSeq).toString(36)}_${Math.random().toString(36).slice(2, 7)}`;

// ═══════════════════════════════════════════════════════════
// パーサ（テキスト → schema）
//   relationship = { parent, child, parentCol, childCol, cardinality, label }
//   parent = 1(PK)側テーブル名 / child = 多(FK)側テーブル名 / *Col は列名 or null
// ═══════════════════════════════════════════════════════════

// カーディナリティは「親(左, 1側) -- 子(右, 多側)」の向きで統一する
function opToCardinality(op) {
  if (op === '-') return '||--||';   // 1対1
  if (op === '<>') return '}o--o{';  // 多対多
  return '||--o{';                   // 1対多（親1 → 子多）
}

// ── DBML パーサ ──
function parseDbml(src) {
  const entities = {};
  const relationships = [];
  const lines = src.split(/\r?\n/);
  let currentTable = null;
  let inProject = false;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].replace(/^\s+|\s+$/g, '');
    if (!line || line.startsWith('//')) continue;
    if (/^Project\s+/.test(line)) { inProject = true; continue; }
    if (inProject) { if (line === '}') inProject = false; continue; }
    const tblMatch = line.match(/^Table\s+(?:"([^"]+)"|(\S+))\s*(?:as\s+\S+)?\s*\{/i);
    if (tblMatch) {
      const name = tblMatch[1] || tblMatch[2];
      currentTable = { name, columns: [] };
      entities[name] = currentTable;
      continue;
    }
    if (currentTable && line === '}') { currentTable = null; continue; }
    if (currentTable) {
      const m = line.match(/^(?:"([^"]+)"|(\S+))\s+(\S+?)(?:\s*\[(.*)\])?\s*$/);
      if (m) {
        const colName = m[1] || m[2];
        const colType = m[3];
        const attrs = (m[4] || '').toLowerCase();
        let key = '';
        if (/\bpk\b/.test(attrs) || /\bprimary key\b/.test(attrs)) key = 'PK';
        if (/\bfk\b/.test(attrs) || /\bref\s*:/.test(attrs)) key = key === 'PK' ? 'PK,FK' : 'FK';
        currentTable.columns.push({ type: colType, name: colName, key });
        // inline ref: [ref: > parent.col]
        const refMatch = (m[4] || '').match(/ref\s*:\s*([><\-]+)\s*"?([^".\s]+)"?\.\s*"?([^".\s\]]+)"?/i);
        if (refMatch) {
          relationships.push({
            parent: refMatch[2], parentCol: refMatch[3],
            child: currentTable.name, childCol: colName,
            cardinality: opToCardinality(refMatch[1]), label: '',
          });
        }
      }
      continue;
    }
    // 独立 Ref: "child"."c" > "parent"."c"
    const refMatch = line.match(/^Ref(?:\s+\S+)?\s*:\s*"?([^".]+)"?\.\s*"?([^".\s]+)"?\s*([><\-]+)\s*"?([^".]+)"?\.\s*"?([^".\s\/]+)"?(?:\s*\/\/\s*(.*))?$/);
    if (refMatch) {
      relationships.push({
        child: refMatch[1], childCol: refMatch[2],
        parent: refMatch[4], parentCol: refMatch[5],
        cardinality: opToCardinality(refMatch[3]),
        label: (refMatch[6] || '').trim(),
      });
    }
  }
  return { entities, relationships };
}

// ── Mermaid erDiagram パーサ ──
function parseMermaidErd(src) {
  const entities = {};
  const relationships = [];
  let body = src;
  if (body.startsWith('---')) {
    const end = body.indexOf('---', 3);
    if (end !== -1) body = body.slice(end + 3);
  }
  body = body.replace(/^\s*erDiagram\s*$/m, '');
  const lines = body.split(/\r?\n/);
  let cur = null;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].replace(/^\s+|\s+$/g, '');
    if (!line || line.startsWith('%%')) continue;
    const startE = line.match(/^(\S+)\s*\{$/);
    if (startE) { cur = { name: startE[1], columns: [] }; entities[cur.name] = cur; continue; }
    if (cur && line === '}') { cur = null; continue; }
    if (cur) {
      const m = line.match(/^(\S+)\s+(\S+?)(?:\s+(PK|FK|PK,FK|FK,PK))?$/);
      if (m) cur.columns.push({ type: m[1], name: m[2], key: m[3] || '' });
      continue;
    }
    // parent card child : label  （Mermaid は左が1(PK)側、右が多(FK)側）
    const rel = line.match(/^(\S+)\s+([}{|o<>0-9\-]+--[}{|o<>0-9\-]+)\s+(\S+)\s*:\s*"?([^"]*)"?$/);
    if (rel) relationships.push({ parent: rel[1], child: rel[3], parentCol: null, childCol: null, cardinality: rel[2], label: rel[4] || '' });
  }
  return { entities, relationships };
}

function detectFormat(src) {
  if (/^\s*Table\s+/m.test(src) || /^\s*Ref\s*:/m.test(src) || /^\s*Project\s+/m.test(src)) return 'dbml';
  if (/^\s*erDiagram\s*$/m.test(src) || /\|\|--o?\{|\|\|--\|\||\}o--o?\{|\}o--\|\|/.test(src)) return 'mermaid';
  return 'dbml';
}

function parse(src, format) {
  const fmt = format === 'auto' ? detectFormat(src) : format;
  try {
    return { format: fmt, ...(fmt === 'mermaid' ? parseMermaidErd(src) : parseDbml(src)), error: null };
  } catch (e) {
    return { format: fmt, entities: {}, relationships: [], error: e.message };
  }
}

// ═══════════════════════════════════════════════════════════
// 内部モデル（単一情報源）
//   model = { tables: [{id,name,x,y,cols:[{id,name,type,pk}]}],
//             rels:   [{id,parentId,childId,parentCol,childCol,cardinality,label}] }
// ═══════════════════════════════════════════════════════════

function schemaToModel(schema) {
  const tables = [];
  const nameToTable = {};
  for (const [name, entity] of Object.entries(schema.entities || {})) {
    const cols = (entity.columns || []).map((c) => ({
      id: uid('col'), name: c.name, type: c.type || '', pk: /PK/.test(c.key || ''),
    }));
    const t = { id: uid('tbl'), name, x: 0, y: 0, cols };
    tables.push(t);
    nameToTable[name] = t;
  }
  const findCol = (t, colName) => {
    if (!t || !colName) return null;
    const c = t.cols.find((c) => c.name === colName);
    return c ? c.id : null;
  };
  const rels = [];
  for (const r of (schema.relationships || [])) {
    const pt = nameToTable[r.parent];
    const ct = nameToTable[r.child];
    if (!pt || !ct) continue;
    rels.push({
      id: uid('rel'),
      parentId: pt.id, childId: ct.id,
      parentCol: findCol(pt, r.parentCol),
      childCol: findCol(ct, r.childCol),
      card: cardFromString(r.cardinality),
      label: r.label || '',
    });
  }
  return { tables, rels };
}

// FK 判定: ある列が何らかの rel の child 側列なら FK
function fkColIdSet(model) {
  const s = new Set();
  for (const r of model.rels) if (r.childCol) s.add(`${r.childId}:${r.childCol}`);
  return s;
}

// 名前のクオート要否（英数字_のみなら裸でOK）
const needsQuote = (n) => !/^[A-Za-z_][A-Za-z0-9_]*$/.test(n || '');
const q = (n) => (needsQuote(n) ? `"${n}"` : n);

function modelToDbml(model) {
  const lines = [];
  lines.push('// ER エディタで生成 (DBML)');
  for (const t of model.tables) {
    lines.push(`Table ${q(t.name || 'table')} {`);
    if (t.cols.length === 0) lines.push('  id int [pk]');
    for (const c of t.cols) {
      const attrs = c.pk ? ' [pk]' : '';
      lines.push(`  ${q(c.name || 'col')} ${c.type || 'text'}${attrs}`);
    }
    lines.push('}');
    lines.push('');
  }
  const nameById = Object.fromEntries(model.tables.map((t) => [t.id, t]));
  const colName = (t, colId) => (t && colId ? (t.cols.find((c) => c.id === colId) || {}).name : null);
  for (const r of model.rels) {
    const ct = nameById[r.childId], pt = nameById[r.parentId];
    if (!ct || !pt) continue;
    const cc = colName(ct, r.childCol);
    const pc = colName(pt, r.parentCol);
    const op = CARD_DBML_OP[r.card] || '>';
    const note = r.label ? ` // ${r.label}` : '';
    if (cc && pc) {
      lines.push(`Ref: ${q(ct.name)}.${q(cc)} ${op} ${q(pt.name)}.${q(pc)}${note}`);
    } else {
      // 列未指定（テーブルレベル）の関連は DBML では表現できないためコメントで保持
      lines.push(`// Ref(列未指定): ${q(ct.name)} ${op} ${q(pt.name)}${note}`);
    }
  }
  return lines.join('\n') + '\n';
}

function modelToMermaid(model) {
  const lines = ['erDiagram', ''];
  const fkSet = fkColIdSet(model);
  for (const t of model.tables) {
    lines.push(`${t.name || 'table'} {`);
    if (t.cols.length === 0) lines.push('  int id PK');
    for (const c of t.cols) {
      const isFk = fkSet.has(`${t.id}:${c.id}`);
      const key = c.pk ? (isFk ? 'PK,FK' : 'PK') : (isFk ? 'FK' : '');
      lines.push(`  ${c.type || 'text'} ${c.name || 'col'}${key ? ' ' + key : ''}`);
    }
    lines.push('}');
    lines.push('');
  }
  const nameById = Object.fromEntries(model.tables.map((t) => [t.id, t]));
  for (const r of model.rels) {
    const ct = nameById[r.childId], pt = nameById[r.parentId];
    if (!ct || !pt) continue;
    // Mermaid 規約: 左=親(1側) / 右=子(多側)
    lines.push(`${pt.name} ${CARD_MERMAID[r.card] || '||--o{'} ${ct.name} : "${r.label || ''}"`);
  }
  return lines.join('\n') + '\n';
}

function serialize(model, fmt) {
  return fmt === 'mermaid' ? modelToMermaid(model) : modelToDbml(model);
}

// ═══════════════════════════════════════════════════════════
// ELK 自動レイアウト
// ═══════════════════════════════════════════════════════════
const elk = new ELK();
const tableHeight = (t) => HEAD_H + Math.max(t.cols.length, 1) * ROW_H + 28;

async function computeLayout(model) {
  const elkGraph = {
    id: 'root',
    layoutOptions: {
      'elk.algorithm': 'layered',
      'elk.direction': 'RIGHT',
      'elk.layered.spacing.nodeNodeBetweenLayers': '90',
      'elk.spacing.nodeNode': '60',
      'elk.layered.nodePlacement.strategy': 'BRANDES_KOEPF',
    },
    children: model.tables.map((t) => ({ id: t.id, width: 280, height: tableHeight(t) })),
    edges: model.rels
      .filter((r) => r.childId && r.parentId)
      .map((r) => ({ id: r.id, sources: [r.childId], targets: [r.parentId] })),
  };
  const layouted = await elk.layout(elkGraph);
  const pos = {};
  for (const child of layouted.children || []) pos[child.id] = { x: child.x, y: child.y };
  return model.tables.map((t) => ({ ...t, x: pos[t.id]?.x ?? t.x, y: pos[t.id]?.y ?? t.y }));
}

const nodeTypes = { table: TableNode };

// ═══════════════════════════════════════════════════════════
// カスタムエッジ（crow's foot マーカー + 列名ラベル）
// ═══════════════════════════════════════════════════════════
// カーディナリティは種別で正規化（親/子は parentId/childId で表現）
//   'one-one' | 'one-many'(親1→子多) | 'many-many'
const CARD_MERMAID = { 'one-one': '||--||', 'one-many': '||--o{', 'many-many': '}o--o{' };
const CARD_DBML_OP = { 'one-one': '-', 'one-many': '>', 'many-many': '<>' };
const CARD_LABEL = { 'one-one': '1対1', 'one-many': '1対多', 'many-many': '多対多' };

// Mermaid/DBML 由来のカーディナリティ文字列 → 種別
function cardFromString(cardinality) {
  const [l, r] = String(cardinality || '||--o{').split('--');
  const many = (g) => /[{}]/.test(g || '');
  if (many(l) && many(r)) return 'many-many';
  if (!many(l) && !many(r)) return 'one-one';
  return 'one-many';
}

// 種別 → 端ごとのマーカー記号（親=PK側 / 子=FK側）
function markersFor(card) {
  return {
    parent: card === 'many-many' ? 'many' : 'one',
    child: card === 'one-one' ? 'one' : 'many',
  };
}

function ErEdge(props) {
  const { id, sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition, markerStart, markerEnd, data, style } = props;
  const [path, labelX, labelY] = getSmoothStepPath({ sourceX, sourceY, sourcePosition, targetX, targetY, targetPosition, borderRadius: 8 });
  return html`
    <${BaseEdge} id=${id} path=${path} markerStart=${markerStart} markerEnd=${markerEnd} style=${style} />
    ${data?.label ? html`
      <${EdgeLabelRenderer}>
        <div
          className="er-edge-label nodrag nopan"
          style=${{ transform: `translate(-50%,-50%) translate(${labelX}px, ${labelY}px)`, opacity: data.dimmed ? 0.15 : 1 }}
        >${data.label}</div>
      </${EdgeLabelRenderer}>
    ` : null}
  `;
}
const edgeTypes = { er: ErEdge };

// crow's foot マーカー定義（document 内に一度だけ注入し url(#id) で参照）
function ErMarkerDefs() {
  return html`
    <svg className="er-defs" aria-hidden="true">
      <defs>
        <marker id="erd-one" viewBox="0 0 22 22" markerWidth=${22} markerHeight=${22} refX=${20} refY=${11} orient="auto-start-reverse" markerUnits="userSpaceOnUse">
          <path d="M12,3 L12,19" fill="none" stroke="#0f766e" strokeWidth=${1.8} strokeLinecap="round" />
        </marker>
        <marker id="erd-many" viewBox="0 0 22 22" markerWidth=${22} markerHeight=${22} refX=${20} refY=${11} orient="auto-start-reverse" markerUnits="userSpaceOnUse">
          <path d="M20,3 L5,11 M20,11 L5,11 M20,19 L5,11" fill="none" stroke="#0f766e" strokeWidth=${1.8} strokeLinecap="round" strokeLinejoin="round" />
        </marker>
      </defs>
    </svg>
  `;
}

// ═══════════════════════════════════════════════════════════
// ビュアー（モデルから nodes/edges を派生・編集を model 経由で反映）
// ═══════════════════════════════════════════════════════════
function ErViewer({ model, setModel, actions, layoutTrigger, fitTrigger, highlightId, setHighlightId, onStatus }) {
  const { fitView } = useReactFlow();
  const fkSet = useMemo(() => fkColIdSet(model), [model]);
  const [editEdge, setEditEdge] = useState(null); // { id, x, y }

  // 関連テーブル（ハイライト用）
  const relatedIds = useMemo(() => {
    if (!highlightId) return null;
    const s = new Set([highlightId]);
    for (const r of model.rels) {
      if (r.childId === highlightId) s.add(r.parentId);
      if (r.parentId === highlightId) s.add(r.childId);
    }
    return s;
  }, [highlightId, model.rels]);

  const nodes = useMemo(() => model.tables.map((t) => ({
    id: t.id,
    type: 'table',
    position: { x: t.x, y: t.y },
    data: {
      table: t,
      fkSet,
      highlighted: highlightId === t.id,
      dimmed: relatedIds ? !relatedIds.has(t.id) : false,
      actions,
    },
  })), [model.tables, fkSet, highlightId, relatedIds, actions]);

  const edges = useMemo(() => {
    const tById = Object.fromEntries(model.tables.map((t) => [t.id, t]));
    const colNm = (t, colId) => (t && colId ? (t.cols.find((c) => c.id === colId) || {}).name : null);
    return model.rels.map((r) => {
      const ct = tById[r.childId], pt = tById[r.parentId];
      const cc = colNm(ct, r.childCol);
      const pc = colNm(pt, r.parentCol);
      const g = markersFor(r.card);
      // ラベル: 「子列 → 親列」。列未指定はテーブルレベル接続
      let label = r.label || '';
      if (cc && pc) label = `${cc} → ${pc}`;
      else if (cc || pc) label = `${cc || '?'} → ${pc || '?'}`;
      const dimmed = relatedIds ? !(relatedIds.has(r.childId) && relatedIds.has(r.parentId)) : false;
      // 位置関係に応じて「近い側」のハンドルへ接続（線が回り込まないように）
      const cx = ct ? ct.x : 0, px = pt ? pt.x : 0;
      const childSide = cx <= px ? 'R' : 'L';
      const parentSide = px < cx ? 'R' : 'L';
      return {
        id: r.id,
        source: r.childId,
        sourceHandle: `${childSide}:${r.childCol || T_HANDLE}`,
        target: r.parentId,
        targetHandle: `${parentSide}:${r.parentCol || T_HANDLE}`,
        type: 'er',
        markerStart: `erd-${g.child}`,  // 子側(FK・多) — React Flow が url('#...') を付与
        markerEnd: `erd-${g.parent}`,   // 親側(PK・1)
        data: { label, dimmed },
        style: dimmed ? { opacity: 0.18 } : undefined,
      };
    });
  }, [model.rels, model.tables, relatedIds]);

  // ELK 自動整列
  useEffect(() => {
    if (!layoutTrigger) return;
    (async () => {
      onStatus?.('自動整列中...');
      try {
        const positioned = await computeLayout(model);
        setModel((m) => ({ ...m, tables: m.tables.map((t) => {
          const p = positioned.find((x) => x.id === t.id);
          return p ? { ...t, x: p.x, y: p.y } : t;
        }) }), { sync: false });
        setTimeout(() => { try { fitView({ padding: 0.12, duration: 400 }); } catch (e) {} }, 80);
        onStatus?.(`✅ ${model.tables.length} テーブル × ${model.rels.length} リレーション`);
      } catch (e) { onStatus?.('整列失敗: ' + e.message, true); }
    })();
  }, [layoutTrigger]);

  // 全体表示ボタン
  useEffect(() => {
    const btn = document.getElementById('btn-fit');
    if (btn) btn.onclick = () => { try { fitView({ padding: 0.12, duration: 400 }); } catch (e) {} };
  }, [fitView]);

  // 保存位置を保ったまま全体表示（復元時など）
  useEffect(() => {
    if (!fitTrigger) return;
    setTimeout(() => { try { fitView({ padding: 0.12, duration: 400 }); } catch (e) {} }, 80);
  }, [fitTrigger]);

  // ノード変更（ドラッグ位置・削除）を model に反映
  const onNodesChange = useCallback((changes) => {
    setModel((m) => {
      let tables = m.tables;
      for (const ch of changes) {
        if (ch.type === 'position' && ch.position) {
          tables = tables.map((t) => (t.id === ch.id ? { ...t, x: ch.position.x, y: ch.position.y } : t));
        } else if (ch.type === 'remove') {
          tables = tables.filter((t) => t.id !== ch.id);
        }
      }
      if (tables === m.tables) return m;
      return { ...m, tables };
      // 位置のみの変更はテキスト非影響だが、削除はテキスト同期が要る → sync 既定 true
    }, { sync: changes.some((c) => c.type === 'remove') });
  }, [setModel]);

  // FK 接続（列→列 もしくは テーブル→テーブル）。ハンドル id の側プレフィックス(L:/R:)を除去
  const stripSide = (h) => (h ? h.replace(/^[LR]:/, '') : null);
  const onConnect = useCallback((conn) => {
    const childId = conn.source, parentId = conn.target;
    if (!childId || !parentId) return;
    const sh = stripSide(conn.sourceHandle), th = stripSide(conn.targetHandle);
    const childCol = sh && sh !== T_HANDLE ? sh : null;
    const parentCol = th && th !== T_HANDLE ? th : null;
    actions.addRelation({ parentId, childId, parentCol, childCol });
  }, [actions]);

  // 接続線クリックで編集ポップオーバーを開く
  const onEdgeClick = useCallback((evt, edge) => {
    evt.stopPropagation();
    setEditEdge({ id: edge.id, x: evt.clientX, y: evt.clientY });
  }, [setEditEdge]);

  // ノードクリックでハイライト（編集要素クリックは無視）
  const onNodeClick = useCallback((evt, node) => {
    if (evt.target.closest('input, button, .react-flow__handle')) return;
    setHighlightId((cur) => (cur === node.id ? null : node.id));
  }, [setHighlightId]);

  return html`
    <${ErMarkerDefs} />
    <${ReactFlow}
      nodes=${nodes} edges=${edges}
      nodeTypes=${nodeTypes}
      edgeTypes=${edgeTypes}
      onNodesChange=${onNodesChange}
      onConnect=${onConnect}
      onEdgeClick=${onEdgeClick}
      onNodeClick=${onNodeClick}
      onPaneClick=${() => { setHighlightId(null); setEditEdge(null); }}
      deleteKeyCode=${null}
      connectionMode="loose"
      minZoom=${0.05} maxZoom=${4}
      fitView
      defaultEdgeOptions=${{ type: 'er' }}
      connectionLineType="smoothstep"
      connectionLineStyle=${{ stroke: '#dc2626', strokeWidth: 2.5, strokeDasharray: '6 3' }}
    >
      <${Background} variant="dots" gap=${20} size=${1} />
      <${Controls} />
      <${MiniMap} nodeColor=${() => '#0f766e'} maskColor="rgba(241, 245, 249, 0.7)" />
    </${ReactFlow}>
    <div className="canvas-hint">列端の●を別テーブルの列へドラッグ → 接続（両側OK）／ 線クリック → 種別・向き・削除を編集</div>
    ${editEdge ? html`<${EdgeEditor} editEdge=${editEdge} model=${model} actions=${actions} onClose=${() => setEditEdge(null)} />` : null}
  `;
}

// 接続線クリックで開く編集ポップオーバー（カーディナリティ種別 / 向き反転 / ラベル / 削除）
function EdgeEditor({ editEdge, model, actions, onClose }) {
  const rel = model.rels.find((r) => r.id === editEdge.id);
  if (!rel) return null;
  const tById = Object.fromEntries(model.tables.map((t) => [t.id, t]));
  const colNm = (tid, colId) => (colId ? (tById[tid]?.cols.find((c) => c.id === colId) || {}).name : null);
  const ctName = tById[rel.childId]?.name || '?';
  const ptName = tById[rel.parentId]?.name || '?';
  const cc = colNm(rel.childId, rel.childCol), pc = colNm(rel.parentId, rel.parentCol);
  const stop = (e) => e.stopPropagation();
  const left = Math.min(editEdge.x, (typeof window !== 'undefined' ? window.innerWidth : 1200) - 240);
  const top = Math.min(editEdge.y, (typeof window !== 'undefined' ? window.innerHeight : 800) - 230);
  return html`
    <div className="edge-editor" style=${{ left: `${left}px`, top: `${top}px` }} onMouseDown=${stop} onClick=${stop}>
      <div className="ee-head">
        <span>リレーション編集</span>
        <button className="ee-x" onClick=${onClose} title="閉じる">✕</button>
      </div>
      <div className="ee-rel">
        <b>${ptName}${pc ? '.' + pc : ''}</b><span className="ee-1"> (1側/親) </span>
        ⟶
        <b>${ctName}${cc ? '.' + cc : ''}</b><span className="ee-n"> (多側/子) </span>
      </div>
      <div className="ee-label">カーディナリティ</div>
      <div className="ee-cards">
        ${['one-one', 'one-many', 'many-many'].map((k) => html`
          <button
            key=${k}
            className=${`ee-card${rel.card === k ? ' on' : ''}`}
            onClick=${() => actions.setCard(rel.id, k)}
          >${CARD_LABEL[k]}</button>
        `)}
      </div>
      <div className="ee-label">ラベル（任意）</div>
      <input className="ee-input" value=${rel.label || ''} placeholder="例: 所属 / 注文" onChange=${(e) => actions.setRelLabel(rel.id, e.target.value)} />
      <div className="ee-actions">
        <button className="ee-btn" onClick=${() => actions.swapRelation(rel.id)} title="親(1側)と子(多側)を入れ替え">⇄ 向き反転</button>
        <button className="ee-btn ee-del" onClick=${() => { actions.deleteRelation(rel.id); onClose(); }}>🗑️ 削除</button>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════
// アプリ統合
// ═══════════════════════════════════════════════════════════
function App() {
  const [model, setModelRaw] = useState({ tables: [], rels: [] });
  const [layoutTrigger, setLayoutTrigger] = useState(0);
  const [fitTrigger, setFitTrigger] = useState(0);
  const [highlightId, setHighlightId] = useState(null);
  const editorRef = useRef(null);
  const formatRef = useRef('auto');
  const debTimerRef = useRef(null);
  const saveTimerRef = useRef(null);
  const modelRef = useRef(model);
  modelRef.current = model;

  const setStatus = useCallback((text, isError) => {
    const el = document.getElementById('status');
    if (el) { el.textContent = text; el.className = isError ? 'status-err' : 'status-ok'; }
  }, []);

  const updateCharCount = useCallback(() => {
    const ed = editorRef.current;
    const out = document.getElementById('char-count');
    if (ed && out) out.textContent = `${ed.value.length} 文字`;
  }, []);

  const outFormat = useCallback(() => {
    const f = formatRef.current;
    if (f === 'mermaid') return 'mermaid';
    if (f === 'dbml') return 'dbml';
    // auto: テキストから推定（空なら dbml）
    const src = editorRef.current?.value || '';
    return src.trim() ? detectFormat(src) : 'dbml';
  }, []);

  // localStorage 保存（debounce）
  const persist = useCallback((m) => {
    clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          model: m, text: editorRef.current?.value || '', format: formatRef.current,
        }));
      } catch (e) {}
    }, 400);
  }, []);

  // モデル更新の中核。opts.sync=true でテキスト再生成（キャンバス編集起点）
  const setModel = useCallback((updater, opts = {}) => {
    const sync = opts.sync !== false; // 既定 true
    setModelRaw((prev) => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      if (next === prev) return prev;
      if (sync && editorRef.current) {
        editorRef.current.value = serialize(next, outFormat());
        updateCharCount();
        setStatus(`✏️ 編集を反映: ${next.tables.length} テーブル / ${next.rels.length} リレーション`);
      }
      persist(next);
      return next;
    });
  }, [outFormat, updateCharCount, setStatus, persist]);

  // テキスト → モデル（再パース + ELK 整列）
  const parseTextToModel = useCallback(async () => {
    const ed = editorRef.current;
    if (!ed) return;
    const src = ed.value;
    updateCharCount();
    if (!src.trim()) { setModel({ tables: [], rels: [] }, { sync: false }); setStatus('入力待ち'); return; }
    const result = parse(src, formatRef.current);
    if (result.error) { setStatus(`❌ パース失敗 (${result.format}): ${result.error}`, true); return; }
    const entCount = Object.keys(result.entities).length;
    if (entCount === 0) { setStatus(`⚠️ パース成功だが entity 0 件 (${result.format})。形式選択を確認`, true); return; }
    let m = schemaToModel({ entities: result.entities, relationships: result.relationships });
    try {
      const positioned = await computeLayout(m);
      m = { ...m, tables: positioned };
    } catch (e) {}
    setModel(m, { sync: false });
    setStatus(`✅ ${result.format.toUpperCase()} を取込: ${entCount} テーブル / ${m.rels.length} リレーション`);
    setLayoutTrigger((t) => t + 1);
  }, [setModel, updateCharCount, setStatus]);

  // ── 編集アクション群（model 経由・テキスト同期）──
  const actions = useMemo(() => ({
    renameTable: (id, name) => setModel((m) => ({ ...m, tables: m.tables.map((t) => t.id === id ? { ...t, name } : t) })),
    deleteTable: (id) => {
      const t = modelRef.current.tables.find((x) => x.id === id);
      if (t && !confirm(`テーブル「${t.name || ''}」を削除しますか？関連するリレーションも削除されます。`)) return;
      setModel((m) => ({
        tables: m.tables.filter((t) => t.id !== id),
        rels: m.rels.filter((r) => r.childId !== id && r.parentId !== id),
      }));
    },
    addColumn: (tableId) => setModel((m) => ({ ...m, tables: m.tables.map((t) => t.id === tableId
      ? { ...t, cols: [...t.cols, { id: uid('col'), name: 'column', type: 'text', pk: false }] } : t) })),
    editColumn: (tableId, colId, patch) => setModel((m) => ({ ...m, tables: m.tables.map((t) => t.id === tableId
      ? { ...t, cols: t.cols.map((c) => c.id === colId ? { ...c, ...patch } : c) } : t) })),
    deleteColumn: (tableId, colId) => setModel((m) => ({
      tables: m.tables.map((t) => t.id === tableId ? { ...t, cols: t.cols.filter((c) => c.id !== colId) } : t),
      rels: m.rels.filter((r) => !(r.childId === tableId && r.childCol === colId) && !(r.parentId === tableId && r.parentCol === colId)),
    })),
    togglePk: (tableId, colId) => setModel((m) => ({ ...m, tables: m.tables.map((t) => t.id === tableId
      ? { ...t, cols: t.cols.map((c) => c.id === colId ? { ...c, pk: !c.pk } : c) } : t) })),
    addRelation: ({ parentId, childId, parentCol, childCol }) => setModel((m) => {
      // 同一エンドポイントの重複・自己参照を排除
      if (parentId === childId && parentCol === childCol) return m;
      const dup = m.rels.some((r) => r.parentId === parentId && r.childId === childId && r.parentCol === parentCol && r.childCol === childCol);
      if (dup) return m;
      return { ...m, rels: [...m.rels, { id: uid('rel'), parentId, childId, parentCol, childCol, card: 'one-many', label: '' }] };
    }),
    setCard: (relId, card) => setModel((m) => ({ ...m, rels: m.rels.map((r) => r.id === relId ? { ...r, card } : r) })),
    setRelLabel: (relId, label) => setModel((m) => ({ ...m, rels: m.rels.map((r) => r.id === relId ? { ...r, label } : r) })),
    // 親(1側)↔子(多側) を入れ替え（card 種別は役割相対なので維持）
    swapRelation: (relId) => setModel((m) => ({ ...m, rels: m.rels.map((r) => r.id === relId
      ? { ...r, parentId: r.childId, childId: r.parentId, parentCol: r.childCol, childCol: r.parentCol } : r) })),
    deleteRelation: (relId) => setModel((m) => ({ ...m, rels: m.rels.filter((r) => r.id !== relId) })),
  }), [setModel]);

  // ＋テーブル追加
  const addTable = useCallback(() => {
    setModel((m) => {
      const n = m.tables.length;
      // 既存テーブルに重ならないよう右端の外側へ配置（縦は段階的にずらす）
      let x = 80, y = 80;
      if (m.tables.length) {
        const maxX = Math.max(...m.tables.map((t) => t.x));
        x = maxX + 340;
        y = 80 + (n % 4) * 70;
      }
      const t = {
        id: uid('tbl'), name: `table_${n + 1}`,
        x, y,
        cols: [{ id: uid('col'), name: 'id', type: 'int', pk: true }],
      };
      return { ...m, tables: [...m.tables, t] };
    });
    setStatus('＋ テーブルを追加しました（右端に配置・全体表示でフォーカス）');
    setTimeout(() => setFitTrigger((t) => t + 1), 70);
  }, [setModel, setStatus, setFitTrigger]);

  // 初期化: localStorage 復元 + エディタ配線
  useEffect(() => {
    const ed = document.getElementById('editor');
    editorRef.current = ed;
    const fmt = document.getElementById('format');

    // 復元
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (saved && saved.model && Array.isArray(saved.model.tables) && saved.model.tables.length) {
        formatRef.current = saved.format || 'auto';
        fmt.value = formatRef.current;
        ed.value = saved.text || serialize(saved.model, formatRef.current === 'mermaid' ? 'mermaid' : 'dbml');
        // id 連番が衝突しないよう seq を進める
        setModelRaw(saved.model);
        setStatus(`💾 前回の作業を復元: ${saved.model.tables.length} テーブル`);
        setTimeout(() => setFitTrigger((t) => t + 1), 50);
      }
    } catch (e) {}
    updateCharCount();

    const onInput = () => {
      clearTimeout(debTimerRef.current);
      debTimerRef.current = setTimeout(parseTextToModel, 500);
    };
    ed.addEventListener('input', onInput);
    const onFmt = () => {
      formatRef.current = fmt.value;
      // 形式切替時は現モデルを新形式でテキスト再生成
      if (modelRef.current.tables.length) {
        ed.value = serialize(modelRef.current, outFormat());
        updateCharCount();
        setStatus(`形式を ${fmt.value} に変更`);
      }
    };
    fmt.addEventListener('change', onFmt);
    return () => { ed.removeEventListener('input', onInput); fmt.removeEventListener('change', onFmt); };
  }, [parseTextToModel, updateCharCount, setStatus, outFormat]);

  // ツールバー配線
  useEffect(() => {
    const btn = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    btn('btn-add-table', addTable);
    btn('btn-load', () => document.getElementById('file-input').click());
    document.getElementById('file-input').onchange = (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { editorRef.current.value = reader.result; parseTextToModel(); setStatus(`📂 読込: ${file.name}`); };
      reader.readAsText(file, 'utf-8');
      e.target.value = '';
    };
    btn('btn-save', () => {
      const text = serialize(modelRef.current, outFormat());
      editorRef.current.value = text;
      updateCharCount();
      const ext = outFormat() === 'mermaid' ? 'mmd' : 'dbml';
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `er-${new Date().toISOString().slice(0, 10)}.${ext}`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      setStatus(`💾 ${ext.toUpperCase()} で保存しました`);
    });
    btn('btn-sample-dbml', () => {
      editorRef.current.value = SAMPLE_DBML;
      document.getElementById('format').value = 'dbml';
      formatRef.current = 'dbml';
      parseTextToModel();
    });
    btn('btn-sample-mermaid', () => {
      editorRef.current.value = SAMPLE_MERMAID;
      document.getElementById('format').value = 'mermaid';
      formatRef.current = 'mermaid';
      parseTextToModel();
    });
    btn('btn-clear', () => {
      if (!confirm('エディタとキャンバスを全て空にします。よろしいですか？')) return;
      editorRef.current.value = '';
      setModel({ tables: [], rels: [] }, { sync: false });
      setHighlightId(null);
      setStatus('クリアしました');
      updateCharCount();
    });
    btn('btn-relayout', () => setLayoutTrigger((t) => t + 1));
  }, [addTable, parseTextToModel, outFormat, updateCharCount, setStatus, setModel]);

  // ドラッグ&ドロップ
  useEffect(() => {
    const dropOverlay = document.getElementById('drop-overlay');
    const viewer = document.querySelector('.viewer-pane');
    const editorPane = document.querySelector('.editor-pane');
    let dragCounter = 0;
    const onDragEnter = (e) => { e.preventDefault(); dragCounter++; dropOverlay.classList.add('show'); };
    const onDragLeave = (e) => { e.preventDefault(); dragCounter--; if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('show'); } };
    const onDragOver = (e) => e.preventDefault();
    const onDrop = (e) => {
      e.preventDefault();
      dragCounter = 0;
      dropOverlay.classList.remove('show');
      const file = e.dataTransfer.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { editorRef.current.value = reader.result; parseTextToModel(); setStatus(`📂 ドロップ読込: ${file.name}`); };
      reader.readAsText(file, 'utf-8');
    };
    [viewer, editorPane].forEach((el) => {
      el.addEventListener('dragenter', onDragEnter);
      el.addEventListener('dragleave', onDragLeave);
      el.addEventListener('dragover', onDragOver);
      el.addEventListener('drop', onDrop);
    });
  }, [parseTextToModel, setStatus]);

  // リサイザー
  useEffect(() => {
    const resizer = document.getElementById('resizer');
    const main = document.querySelector('.main');
    let dragging = false;
    const onDown = () => { dragging = true; resizer.classList.add('active'); document.body.style.userSelect = 'none'; };
    const onMove = (e) => {
      if (!dragging) return;
      const w = Math.max(280, Math.min(800, e.clientX));
      main.style.gridTemplateColumns = `${w}px 6px 1fr`;
    };
    const onUp = () => { dragging = false; resizer.classList.remove('active'); document.body.style.userSelect = ''; };
    resizer.addEventListener('mousedown', onDown);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }, []);

  return html`<${ReactFlowProvider}>
    <${ErViewer}
      model=${model} setModel=${setModel} actions=${actions}
      layoutTrigger=${layoutTrigger} fitTrigger=${fitTrigger}
      highlightId=${highlightId} setHighlightId=${setHighlightId}
      onStatus=${setStatus}
    />
  </${ReactFlowProvider}>`;
}

// ═══════════════════════════════════════════════════════════
// サンプルデータ
// ═══════════════════════════════════════════════════════════
const SAMPLE_DBML = `// DBML サンプル — ブログ風スキーマ

}

  id int [pk]
  email varchar

  created_at timestamp
}

  id int [pk]
  user_id int
  title varchar
  body text

Ref: "posts"."user_id" > "users"."id"
Ref: "comments"."post_id" > "posts"."id"
Ref: "comments"."user_id" > "users"."id"
Ref: "post_tags"."post_id" > "posts"."id"
Ref: "post_tags"."tag_id" > "tags"."id"
`;

// マウント
// ═══════════════════════════════════════════════════════════
createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
